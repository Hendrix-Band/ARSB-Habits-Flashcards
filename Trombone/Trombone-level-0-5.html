<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trombone - Habits of A Successful Beginning Band Musician (Level 0.5 Flashcards)</title>
<style>
* { box-sizing: border-box; }
:root {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #111;
  background: #f3f4f6;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #f3f4f6;
}
button {
  font: inherit;
  cursor: pointer;
  border: 1px solid #c8cbd0;
  border-radius: 12px;
  background: white;
  padding: 11px 16px;
  min-height: 44px;
}
button:hover { background: #f8f8f8; }
button:active { transform: translateY(1px); }
button.active {
  background: #111;
  color: white;
  border-color: #111;
}
.app {
  width: min(800px, 100%);
  margin: 0 auto;
  padding: 20px 16px 28px;
}
header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 14px;
}
h1 {
  font-size: clamp(1.15rem, 3.4vw, 1.85rem);
  line-height: 1.18;
  margin: 0;
  max-width: 540px;
}
.toolbar {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.progress {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
  color: #4b5563;
  font-size: .95rem;
}
.hint {
  text-align: right;
  font-size: .85rem;
}
.card {
  width: 100%;
  aspect-ratio: 4 / 3;
  perspective: 1200px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
  outline: none;
}
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .38s ease;
  transform-style: preserve-3d;
}
.card.flipped .card-inner {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: white;
  border: 1px solid #d6d8dc;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 28px rgba(0,0,0,.08);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.card-back {
  transform: rotateY(180deg);
}
.card-face img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.nav {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
#flipBtn {
  background: #111;
  color: white;
  border-color: #111;
}
@media (max-width: 620px) {
  .app { padding: 14px 10px 22px; }
  header {
    flex-direction: column;
    gap: 12px;
  }
  .toolbar {
    width: 100%;
  }
  .toolbar button {
    flex: 1;
  }
  .progress {
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
  }
  .hint { text-align: left; }
  .nav {
    grid-template-columns: 1fr 1fr;
  }
  #flipBtn {
    grid-column: 1 / -1;
    grid-row: 1;
  }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Trombone - Habits of A Successful Beginning Band Musician (Level 0.5 Flashcards)</h1>
    <div class="toolbar">
      <button id="orderBtn" class="active" type="button">In Order</button>
      <button id="shuffleBtn" type="button">Shuffle</button>
    </div>
  </header>

  <div class="progress" aria-live="polite">
    <span id="counter">Card 1 of 7</span>
    <span class="hint">Tap to flip • Swipe for next/previous</span>
  </div>

  <section id="card" class="card" tabindex="0" aria-label="Flash card. Tap or press Space to flip.">
    <div class="card-inner">
      <div class="card-face card-front">
        <img id="frontImg" alt="Music staff flash card">
      </div>
      <div class="card-face card-back">
        <img id="backImg" alt="Note name and trombone slide position">
      </div>
    </div>
  </section>

  <nav class="nav">
    <button id="prevBtn" type="button">← Previous</button>
    <button id="flipBtn" type="button">Flip Card</button>
    <button id="nextBtn" type="button">Next →</button>
  </nav>
</main>

let deck = [...originalDeck];
let index = 0;

const card = document.getElementById("card");
const frontImg = document.getElementById("frontImg");
const backImg = document.getElementById("backImg");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const flipBtn = document.getElementById("flipBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const orderBtn = document.getElementById("orderBtn");

function sameOrder(a, b) {
  return a.length === b.length && a.every((item, i) => item.id === b[i].id);
}

function makeDifferentShuffle(source) {
  if (source.length < 2) return [...source];
  let shuffled;
  do {
    shuffled = [...source];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
  } while (sameOrder(shuffled, source));
  return shuffled;
}

function showCard() {
  const item = deck[index];
  card.classList.remove("flipped");
  frontImg.src = item.front;
  backImg.src = item.back;
  counter.textContent = `Card ${index + 1} of ${deck.length}`;
}

function flipCard() {
  card.classList.toggle("flipped");
}

function nextCard() {
  index = (index + 1) % deck.length;
  showCard();
}

function prevCard() {
  index = (index - 1 + deck.length) % deck.length;
  showCard();
}

function shuffleDeck() {
  deck = makeDifferentShuffle(deck);
  index = 0;
  shuffleBtn.classList.add("active");
  orderBtn.classList.remove("active");
  showCard();
}

function restoreOrder() {
  deck = [...originalDeck];
  index = 0;
  orderBtn.classList.add("active");
  shuffleBtn.classList.remove("active");
  showCard();
}

card.addEventListener("click", flipCard);
flipBtn.addEventListener("click", flipCard);
nextBtn.addEventListener("click", nextCard);
prevBtn.addEventListener("click", prevCard);
shuffleBtn.addEventListener("click", shuffleDeck);
orderBtn.addEventListener("click", restoreOrder);

card.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    flipCard();
  } else if (e.code === "ArrowRight") {
    nextCard();
  } else if (e.code === "ArrowLeft") {
    prevCard();
  }
});

let startX = 0;
let startY = 0;

card.addEventListener("touchstart", (e) => {
  const t = e.changedTouches[0];
  startX = t.clientX;
  startY = t.clientY;
}, { passive: true });

card.addEventListener("touchend", (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) nextCard();
    else prevCard();
  }
}, { passive: true });

showCard();
</script>
