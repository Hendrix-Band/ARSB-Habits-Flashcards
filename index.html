<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARSB Habits Flashcards</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #1f3a5f;
      color: white;
      text-align: center;
      padding: 32px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      font-size: 18px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 18px 40px;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .instrument {
      display: block;
      text-decoration: none;
      background: white;
      color: #1f3a5f;
      border: 2px solid #d7dee7;
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,.08);
      transition: .15s;
    }

    .instrument:hover {
      transform: translateY(-2px);
      border-color: #1f3a5f;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>ARSB Habits Flashcards</h1>
  <p>Choose your instrument</p>
</header>

<main>

  <h2>Instrument Flashcards</h2>

  <div class="grid">

    <a class="instrument" href="flute/">
      Flute
    </a>

    <a class="instrument" href="clarinet/">
      Clarinet
    </a>

    <a class="instrument" href="Alto%20Saxophone/">
      Alto Saxophone
    </a>

    <a class="instrument" href="Trumpet/">
      Trumpet
    </a>

    <a class="instrument" href="French%20Horn/">
      French Horn
    </a>

    <a class="instrument" href="Trombone/">
      Trombone
    </a>

    <a class="instrument" href="Euphonium/">
      Euphonium / Baritone B.C.
    </a>

    <a class="instrument" href="Tuba/">
      Tuba
    </a>

    <a class="instrument" href="Mallets/">
      Mallet Percussion
    </a>

  </div>

</main>

<footer>
  Athens Renaissance School Band
</footer>

</body>
</html>
